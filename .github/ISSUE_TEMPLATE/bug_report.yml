name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Logs and screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "GitGone 26.10.6, Node 22.12, Linux"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
